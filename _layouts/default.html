<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ '/' | relative_url }}">JLFC<span>.</span></a>
    <nav>
      <a href="{{ '/' | relative_url }}#articulos">Artículos</a>
      <a href="{{ '/sobre-mi/' | relative_url }}">Sobre mí</a>
    </nav>
  </header>

  <main>{{ content }}</main>

  <footer class="foot">
    <p class="foot-lema">{{ site.tagline }}</p>
    <div class="foot-redes">
      <a href="{{ site.social.instagram }}" rel="me noopener" target="_blank">Instagram</a>
      <a href="{{ site.social.linkedin }}" rel="me noopener" target="_blank">LinkedIn</a>
      <a href="{{ site.social.x }}" rel="me noopener" target="_blank">X</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
    <p class="foot-legal">© {{ 'now' | date: '%Y' }} Jorge Luis Fernández Chuljak · Panamá</p>
  </footer>
</body>
</html>
